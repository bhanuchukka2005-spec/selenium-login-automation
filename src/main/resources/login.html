<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selenium Login Demo</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }
        .login-card {
            width: min(90%, 380px);
            padding: 30px;
            border-radius: 14px;
            background: white;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        }
        h1 { margin-top: 0; text-align: center; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        #message { min-height: 24px; margin-bottom: 0; font-weight: 600; }
        .hint { color: #64748b; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Login</h1>
        <p class="hint">Demo credentials: admin / admin123</p>
        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button id="loginButton" type="submit">Log in</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
    </main>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (username === "admin" && password === "admin123") {
                message.textContent = "Login successful. Welcome, admin!";
                message.style.color = "#15803d";
            } else {
                message.textContent = "Login failed. Invalid username or password.";
                message.style.color = "#b91c1c";
            }
        });
    </script>
</body>
</html>
